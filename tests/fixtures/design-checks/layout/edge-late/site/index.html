<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Overflow that appears on scroll</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1c2230; background: #faf7f0; }
  main { padding: 16px; }
  .late { height: 20px; background: #ddd; }
  .spacer { height: 1500px; }
</style></head>
<body><main>
  <h1>A block that grows once the page is scrolled</h1>
  <div class="spacer"></div>
  <div class="late" id="late">Lazy content that arrives wider than the screen</div>
</main>
<script>addEventListener('scroll', () => { if (scrollY > 200) document.getElementById('late').style.width = '3000px'; }, { passive: true });</script>
</body></html>
